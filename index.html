<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julekalender</title>

<!-- Skrifttype fra Google Fonts. Hvis den ikke kan hentes, bruges Georgia i stedet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!--
  Filerne i projektet:
  - indhold.js  : ALT indhold – lågernes tekster, opgaver, præmier og indstillinger. Ret her.
  - grafik.js   : tegningerne til regneopgaverne.
  - kalender.js : logikken (point, spil, butik, synkronisering). Behøver ikke rettes.
  - styles.css  : udseendet.
-->

<header>
  <h1>Julekalender</h1>
  <p id="undertitel"></p>
  <div class="status">
    <p class="titel-linje" id="titel-navn"></p>
    <div class="niveau-bar" aria-hidden="true"><div id="niveau-fyld"></div></div>
    <p id="stilling"></p>
    <ol id="niveauer" class="niveauer"></ol>
    <button type="button" id="aabn-butik">🎁 Julebutik · <span id="butik-saldo">0</span> point</button>
  </div>
</header>

<div class="indhold">
  <!-- Spillehallen: spil, han har låst op, med rekorder -->
  <aside id="spillehal" class="spillehal">
    <h2>Spillehallen</h2>
    <ul id="spillehal-liste"></ul>
  </aside>
  <!-- Lågerne bygges af kalender.js -->
  <ol id="kalender"></ol>
</div>
<section id="spilleder" class="kort" hidden></section>
<div id="testbanner" hidden>Testtilstand: alle låger kan åbnes, og intet gemmes på hans rigtige plads.</div>

<dialog id="kort">
  <div class="kort">
    <p class="dag" id="kort-dag"></p>
    <h2 id="kort-titel"></h2>
    <div id="kort-indhold"></div>
    <div id="kort-handling"></div>
    <button type="button" id="luk">Luk</button>
  </div>
</dialog>

<dialog id="butik">
  <div class="kort">
    <h2>Julebutikken</h2>
    <p class="saldo"><strong id="butik-saldo-stor">0</strong> point at bruge</p>
    <div id="tillykke" class="tillykke" hidden></div>
    <ul id="butik-liste" class="kuponer"></ul>
    <h3 id="mine-overskrift" hidden>Mine præmier</h3>
    <ul id="mine-kuponer" class="kuponer"></ul>
    <button type="button" id="luk-butik">Luk</button>
  </div>
</dialog>

<script src="indhold.js"></script>
<script src="grafik.js"></script>
<script src="kalender.js"></script>
</body>
</html>
